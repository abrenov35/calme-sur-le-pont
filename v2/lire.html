<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Lecture — Le Calme sur le Pont</title>
  <style>
    :root {
      --navy: #162D49;
      --navy2: #1e3d61;
      --gold: #C8A464;
      --beige: #0e1e2e;
      --dark: #e8e8e8;
      --mid: #8a9db0;
      --light: rgba(255,255,255,0.04);
      --border: #2a4060;
      --v1bg: rgba(255,255,255,0.03);
      --v2bg: rgba(200,164,100,0.04);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Helvetica Neue', Arial, sans-serif; background: var(--beige); color: var(--dark); min-height: 100vh; }

    .topnav {
      background: var(--navy);
      padding: 10px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      position: sticky;
      top: 0;
      z-index: 200;
      border-bottom: 2px solid var(--gold);
    }
    .topnav a { color: #8a9db0; text-decoration: none; font-size: 11px; letter-spacing: 1px; }
    .topnav a:hover { color: var(--gold); }
    .topnav .sep { color: #2a4060; }
    .topnav .current { color: var(--gold); font-size: 11px; }

    .workspace { display: grid; grid-template-columns: 260px 1fr; gap: 0; min-height: calc(100vh - 45px); }

    .panel-left {
      background: rgba(255,255,255,0.02);
      border-right: 1px solid var(--border);
      padding: 20px 0;
    }
    .panel-left .ph-title {
      font-family: Georgia, serif; font-size: 11px; letter-spacing: 3px; text-transform: uppercase;
      color: var(--gold); padding: 0 20px 16px; border-bottom: 1px solid var(--border); margin-bottom: 8px;
    }
    .chapter-link {
      display: flex; justify-content: space-between; align-items: flex-start;
      padding: 10px 20px; font-size: 13px; color: var(--dark);
      text-decoration: none; border-left: 3px solid transparent; cursor: pointer;
    }
    .chapter-link:hover { background: var(--light); }
    .chapter-link.active { border-left-color: var(--gold); background: var(--light); color: var(--gold); font-weight: bold; }
    .chapter-link .ch-num {
      font-family: 'Helvetica Neue', sans-serif; font-size: 9px; letter-spacing: 2px;
      text-transform: uppercase; color: var(--gold); display: block; margin-bottom: 2px;
    }
    .chapter-link .ch-sub { font-size: 13px; }
    .chapter-link .edit-link { text-decoration: none; font-size: 14px; flex-shrink: 0; padding-left: 8px; }
    .chapter-link .edit-link:hover { opacity: 0.6; }

    .panel-right { background: var(--beige); }
    .preview-body { padding: 40px; }

    .book-preview { max-width: 600px; margin: 0 auto; font-family: 'Georgia', 'Times New Roman', serif; }
    .book-preview .ch-label { font-family: 'Helvetica Neue', sans-serif; font-size: 11px; letter-spacing: 4px; text-transform: uppercase; color: var(--gold); margin-bottom: 10px; font-weight: 600; }
    .book-preview .ch-title { font-size: 30px; font-weight: normal; letter-spacing: 1.5px; margin-bottom: 24px; color: #ffffff; line-height: 1.3; }
    .book-preview .ch-divider { width: 48px; height: 2px; background: var(--gold); margin-bottom: 32px; border-radius: 1px; }
    .book-preview p { font-size: 16px; line-height: 1.95; color: #d8dde3; margin-bottom: 16px; text-align: justify; hyphens: auto; }

    /* V1 ZONE — texte original, présenté comme citation littéraire */
    .v1-zone {
      background: rgba(255,255,255,0.025);
      border-radius: 4px;
      padding: 28px 30px;
      margin-bottom: 36px;
      border-left: 3px solid var(--border);
      border-top: 1px solid var(--border);
      border-right: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      position: relative;
    }
    .v1-zone .v1-badge {
      display: inline-block;
      font-family: 'Helvetica Neue', sans-serif;
      font-size: 9px; letter-spacing: 3px; text-transform: uppercase;
      color: var(--mid); background: rgba(255,255,255,0.06);
      padding: 4px 12px; border-radius: 3px;
      margin-bottom: 18px; font-weight: 600;
    }
    .v1-zone p { color: #c5cbd3; font-style: italic; }
    .v1-zone p:last-child { margin-bottom: 0; }
    .v1-lock {
      position: absolute; top: 16px; right: 18px;
      font-size: 14px; color: var(--mid); user-select: none; opacity: 0.6;
    }

    /* V2 ZONE */
    .v2-zone { margin-top: 8px; }
    .v2-separator {
      display: flex; align-items: center; gap: 14px;
      margin: 40px 0 32px;
    }
    .v2-separator .v2-label {
      font-family: 'Helvetica Neue', sans-serif;
      font-size: 10px; letter-spacing: 4px; text-transform: uppercase;
      color: var(--gold); white-space: nowrap; font-weight: 600;
    }
    .v2-separator .v2-line { flex: 1; height: 1px; background: var(--gold); opacity: 0.35; }

    /* Sous-titres de section (anciennement faibles) */
    .book-preview .part-tag {
      font-family: 'Georgia', serif;
      font-size: 20px; font-weight: normal; letter-spacing: 0.5px; text-transform: none;
      color: #ffffff; margin: 36px 0 16px; padding: 0 0 10px 0;
      background: none; border-left: none; border-bottom: 1px solid rgba(200,164,100,0.3);
    }
    .book-preview .note-de-bord {
      background: var(--navy); color: white;
      padding: 22px 26px; margin: 32px 0; border-radius: 4px;
      border: 1px solid rgba(200,164,100,0.2);
    }
    .book-preview .note-de-bord .ndb-label {
      font-family: 'Helvetica Neue', sans-serif;
      font-size: 10px; letter-spacing: 3px; text-transform: uppercase;
      color: var(--gold); margin-bottom: 12px; font-weight: 600;
    }
    .book-preview .note-de-bord p { color: #cfe0ee; font-size: 15px; margin-bottom: 0; font-style: italic; }

    /* Blocs V2 — sans fond, titres en série littéraire */
    .book-preview .encadre {
      background: transparent;
      border: none;
      padding: 0 0 4px;
      margin: 32px 0 8px;
    }
    .book-preview .encadre .enc-label {
      font-family: 'Georgia', serif;
      font-size: 20px; font-weight: normal;
      color: #ffffff;
      margin-bottom: 16px;
      letter-spacing: 0.5px;
      text-transform: none;
      padding-bottom: 10px;
      border-bottom: 1px solid rgba(200,164,100,0.3);
    }
    .book-preview .encadre p { font-size: 16px; color: #d8dde3; line-height: 1.95; }
    .book-preview .illus { margin: 36px 0; text-align: center; }
    .book-preview .illus img { width: 100%; max-width: 520px; border: 1px solid var(--border); border-radius: 3px; }
    .book-preview .empty-state { text-align: center; padding: 60px 20px; color: var(--mid); }
    .book-preview .empty-state .es-icon { font-size: 40px; margin-bottom: 16px; }
    .book-preview .empty-state p { font-size: 13px; font-style: italic; }

    .v2-empty {
      font-family: 'Helvetica Neue', sans-serif;
      font-size: 12px; color: var(--mid); font-style: italic;
      text-align: center; padding: 20px;
      border: 1px dashed var(--border); border-radius: 4px;
    }
    .book-preview .note-de-bord .ndb-label {
      font-family: 'Helvetica Neue', sans-serif;
      font-size: 9px; letter-spacing: 3px; text-transform: uppercase;
      color: var(--gold); margin-bottom: 10px;
    }
    .book-preview .note-de-bord p { color: #c8d8e8; font-size: 14px; margin-bottom: 0; }

    /* Blocs V2 — sans fond, séparés par un filet */
    .book-preview .encadre {
      background: transparent;
      border: none;
      padding: 20px 0 4px;
      margin: 24px 0 8px;
    }
    .book-preview .encadre .enc-label {
      font-family: 'Helvetica Neue', sans-serif;
      font-size: 13px; font-weight: 700;
      color: var(--navy);
      margin-bottom: 12px;
      letter-spacing: 0;
      text-transform: none;
    }
    .book-preview .encadre p { font-size: 15px; color: var(--dark); line-height: 1.9; }
    .book-preview .illus { margin: 28px 0; text-align: center; }
    .book-preview .illus img { width: 100%; max-width: 520px; border: 1px solid var(--border); }
    .book-preview .empty-state { text-align: center; padding: 60px 20px; color: var(--mid); }
    .book-preview .empty-state .es-icon { font-size: 40px; margin-bottom: 16px; }
    .book-preview .empty-state p { font-size: 13px; font-style: italic; }

    .v2-empty {
      font-family: 'Helvetica Neue', sans-serif;
      font-size: 12px; color: var(--mid); font-style: italic;
      text-align: center; padding: 20px;
      border: 1px dashed var(--border); border-radius: 4px;
    }


    @media (max-width: 768px) {
      .workspace { grid-template-columns: 1fr; }
      .panel-left { border-right: none; border-bottom: 1px solid var(--border); }
      .preview-body { padding: 24px; }
    }
  </style>
</head>
<body>

<nav class="topnav">
  <a href="../index.html">Accueil</a>
  <span class="sep">›</span>
  <a href="../v1/index.html">Version 1</a>
  <span class="sep">›</span>
  <a href="index.html">Version 2</a>
  <span class="sep">›</span>
  <a href="atelier.html">Atelier</a>
  <span class="sep">›</span>
  <span class="current">Lecture</span>
  <span class="sep">›</span>
  <a href="../prompts/index.html">Bibliothèque</a>
</nav>

<div class="workspace">
  <div class="panel-left">
    <div class="ph-title">Sommaire</div>
    <div id="chapterList"></div>
  </div>
  <div class="panel-right">
    <div class="preview-body">
      <div class="book-preview" id="bookPreview">
        <div class="empty-state"><div class="es-icon">⚓</div><p>Sélectionnez un chapitre.</p></div>
      </div>
    </div>
  </div>
</div>

<script>
// ══════════════════════════════════════════════
let CHAPTER_NAMES = {};
let CHAPTER_SUBTITLES = {};
let CHAPTER_LABELS = {};
let CHAPTER_TITLES = {};
let CHAPTER_THEMES = {};
let V1_TEXTS = {};
let CHAPTERS_ORDER = [];

async function loadChaptersData() {
  const url = 'https://raw.githubusercontent.com/abrenov35/calme-sur-le-pont/main/chapters.json?v=' + Date.now();
  const resp = await fetch(url);
  const data = await resp.json();
  CHAPTERS_ORDER = data.order;
  for (const [id, ch] of Object.entries(data.chapters)) {
    CHAPTER_NAMES[id] = ch.num;
    CHAPTER_SUBTITLES[id] = ch.title.charAt(0) + ch.title.slice(1).toLowerCase();
    CHAPTER_LABELS[id] = ch.label;
    CHAPTER_TITLES[id] = ch.title;
    CHAPTER_THEMES[id] = ch.theme;
    V1_TEXTS[id] = (ch.v1 || []).map(t => ({type:'p', text:t}));
  }
  init();
}

const CHAPTER_IMAGES = {
  intro:"../assets/images/art_barre.jpeg", preambule:"../assets/images/preambule.jpeg",
  ch1:"../assets/images/ch1.jpeg", ch2:"../assets/images/ch2.jpeg",
  ch3:"../assets/images/ch3.jpeg", ch4:"../assets/images/ch4.jpeg",
  ch5:"../assets/images/ch5_vent_contraire.jpeg", ch6:"../assets/images/ch6_amarres.png",
  ch8:"../assets/images/ch8_courants.jpeg", epilogue:"../assets/images/epilogue.jpeg"
};


// Thèmes de chaque chapitre pour le prompt auto
function mergeParagraphs(blocks) {
  const merged = [];
  let buffer = [];
  blocks.forEach(b => {
    if (b.type === 'p') {
      buffer.push(b.text);
    } else {
      if (buffer.length) { merged.push({type:'p', text: buffer.join(' ')}); buffer = []; }
      merged.push(b);
    }
  });
  if (buffer.length) merged.push({type:'p', text: buffer.join(' ')});
  return merged;
}

function renderBlocksHTML(blocks) {
  let html = '';
  blocks.forEach(block => {
    if (block.type === 'p') {
      html += `<p>${block.text}</p>`;
    } else if (block.type === 'part') {
      html += `<div class="part-tag">${block.text}</div>`;
    } else if (block.type === 'note') {
      html += `<div class="note-de-bord"><div class="ndb-label">Note de bord</div><p>${block.text}</p></div>`;
    } else if (block.type === 'citation') {
      html += `<div style="padding:32px 0;margin:32px 0;text-align:center;border-top:1px solid rgba(200,164,100,0.25);border-bottom:1px solid rgba(200,164,100,0.25)"><p style="font-style:italic;font-size:19px;color:#ffffff;line-height:1.7;font-family:Georgia,serif">"${block.text}"</p><div style="font-family:Helvetica Neue,sans-serif;font-size:10px;letter-spacing:3px;text-transform:uppercase;color:var(--gold);margin-top:14px">— Le Capitaine</div></div>`;
    } else if (block.type === 'encadre') {
      html += `<div class="encadre"><div class="enc-label">${block.title || 'Encadré'}</div><p>${block.text}</p></div>`;
    } else if (block.type === 'question') {
      const lines = block.text.split('\n').filter(l=>l.trim()).map(l=>`<p style="font-style:italic;font-size:17px;color:#ffffff;margin:8px 0;font-family:Georgia,serif">${l.trim()}</p>`).join('');
      html += `<div style="padding:28px 0;margin:32px 0;border-top:1px solid rgba(200,164,100,0.25)"><div style="font-family:Helvetica Neue,sans-serif;font-size:10px;font-weight:600;letter-spacing:3px;text-transform:uppercase;color:var(--gold);margin-bottom:14px">Question au lecteur</div>${lines}</div>`;
    } else if (block.type === 'enseignements') {
      const items = (block.lines || []).map(l=>`<li style="margin-bottom:10px;line-height:1.8;color:#d8dde3">${l.replace(/^[-•*\d.]+\s*/,'')}</li>`).join('');
      html += `<div style="padding:28px 0;margin:32px 0;border-top:1px solid rgba(200,164,100,0.25)"><div style="font-family:Helvetica Neue,sans-serif;font-size:10px;font-weight:600;letter-spacing:3px;text-transform:uppercase;color:var(--gold);margin-bottom:16px">Ce que le voyage nous enseigne</div><ul style="padding-left:20px;font-size:16px;line-height:1.9">${items}</ul></div>`;
    }
  });
  return html;
}


let v2data = {};
function loadState() {
  try {
    const s = localStorage.getItem('csp_v2_enrich');
    if (s) v2data = JSON.parse(s);
  } catch(e) {}
}

function renderPreview(chapterId) {
  const v1 = V1_TEXTS[chapterId] || [];
  const v2 = v2data[chapterId] || [];
  const imgSrc = CHAPTER_IMAGES[chapterId];

  let html = `
    <div class="ch-label">${CHAPTER_LABELS[chapterId]}</div>
    <div class="ch-title">${CHAPTER_TITLES[chapterId]}</div>
    <div class="ch-divider"></div>
  `;

  html += `<div class="v1-zone">${renderBlocksHTML(mergeParagraphs(v1))}</div>`;

  if (v2.length > 0) {
    html += `<div class="v2-separator">
      <div class="v2-line"></div>
      <div class="v2-label">✦ Enrichissements V2</div>
      <div class="v2-line"></div>
    </div>`;
    html += `<div class="v2-zone">${renderBlocksHTML(v2)}</div>`;
  }

  if (imgSrc) html += `<div class="illus"><img src="${imgSrc}" alt="${CHAPTER_TITLES[chapterId]}"/></div>`;

  document.getElementById('bookPreview').innerHTML = html;

  document.querySelectorAll('.chapter-link').forEach(el => {
    el.classList.toggle('active', el.dataset.ch === chapterId);
  });

  const newUrl = new URL(window.location);
  newUrl.searchParams.set('ch', chapterId);
  history.replaceState(null, '', newUrl);

  window.scrollTo({top:0, behavior:'smooth'});
}

function init() {
  loadState();
  const list = document.getElementById('chapterList');
  CHAPTERS_ORDER.forEach(ch => {
    const a = document.createElement('a');
    a.className = 'chapter-link';
    a.dataset.ch = ch;
    a.href = '#';
    a.onclick = (e) => { e.preventDefault(); renderPreview(ch); };

    const label = document.createElement('span');
    label.innerHTML = `<span class="ch-num">${CHAPTER_NAMES[ch]}</span><br/><span class="ch-sub">${CHAPTER_SUBTITLES[ch]}</span>`;
    a.appendChild(label);

    const edit = document.createElement('a');
    edit.className = 'edit-link';
    edit.href = 'atelier.html?ch=' + ch;
    edit.target = '_blank';
    edit.title = "Ouvrir dans l'atelier";
    edit.textContent = '✏️';
    edit.onclick = (e) => e.stopPropagation();
    a.appendChild(edit);

    list.appendChild(a);
  });

  const params = new URLSearchParams(window.location.search);
  let ch = params.get('ch');
  if (!ch || !CHAPTER_NAMES[ch]) ch = CHAPTERS_ORDER[0] || 'intro';
  renderPreview(ch);
}

loadChaptersData();
</script>
</body>
</html>
